<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1">
<title>ESP32-P4 Cloud Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px monospace;background:#1a1a2e;color:#e0e0e0;display:flex;height:100vh}
#login{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a1e;z-index:2000;display:flex;align-items:center;justify-content:center}
#login .box{background:#16213e;padding:24px;border-radius:10px;text-align:center;border:1px solid #0f3460}
#login input{display:block;width:260px;margin:8px auto;padding:8px;font-size:16px;background:#1a1a2e;color:#e0e0e0;border:1px solid #0f3460;border-radius:4px}
#login button{width:260px;margin:8px auto;padding:8px;font-size:16px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer}
#login .err{color:#e94560;font-size:12px;margin-top:8px}
#sidebar{width:320px;padding:12px;overflow-y:auto;background:#16213e;border-right:2px solid #0f3460}
#map{flex:1;height:100vh}
h2{font-size:18px;margin-bottom:8px;color:#e94560}
h3{font-size:13px;margin-top:8px;color:#f5c518}
.stat{font-size:13px;margin:2px 0;color:#ccc}
.slave{border:1px solid #0f3460;border-radius:6px;padding:8px;margin:6px 0;background:#1a1a2e}
.slave .name{font-weight:bold;color:#f5c518}
.slave.OK{border-left:4px solid #00cc00}
.slave.FLU{border-left:4px solid #ffcc00}
.slave.LOST{border-left:4px solid #cc0000}
.slave.VIRT{border-left:4px solid #0080FF}
.slave .val{color:#aaa;font-size:12px}
#toolbar{position:fixed;top:0;right:0;z-index:1000;display:flex;gap:8px;padding:8px}
#counter{font-size:24px;font-weight:bold;color:#f5c518;background:#000a;padding:6px 18px;border-radius:8px;border:1px solid #f5c518}
#logout{font-size:14px;color:#fff;background:#e94560;padding:6px 16px;border-radius:8px;border:none;cursor:pointer}
#status{position:fixed;bottom:8px;left:328px;background:#000a;color:#0f0;padding:4px 10px;border-radius:4px;font-size:12px;z-index:1000}
.dot-marker{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px #000}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h2 style="color:#f5c518;margin-bottom:16px">ESP32-P4 Cloud</h2>
  <input id="loginAcct" placeholder="Account" autocomplete="off">
  <input id="loginPass" type="text" placeholder="Password">
  <button onclick="doLogin()">Log In</button>
  <div class="err" id="loginErr"></div>
</div></div>

<div id="toolbar" style="display:none">
  <div id="counter">0000</div>
  <button id="logout" onclick="doLogout()">Logout</button>
</div>

<div id="sidebar">
  <h2>ESP32-P4 Cloud</h2>
  <div class="stat" id="account"></div>
  <div class="stat" id="master">GPS: --</div>
  <div class="stat" id="zoom">Zoom: --</div>
  <div class="stat" id="bg">Map bg: --</div>
  <div class="stat" id="time">Last update: --</div>
  <div class="stat" id="count">Slaves: 0</div>
  <h3>Cmd</h3>
  <div style="display:flex;gap:4px;margin-bottom:8px">
    <input id="cmdInput" placeholder="Command JSON" style="flex:1;padding:4px;font-size:12px;background:#1a1a2e;color:#e0e0e0;border:1px solid #0f3460;border-radius:4px">
    <button onclick="sendCmd()" style="padding:4px 8px;font-size:12px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer">Send</button>
  </div>
  <h3>Slaves</h3>
  <div id="slaves"></div>
</div>
<div id="map"></div>
<div id="status">Connecting...</div>

<script>
/* ------ MQTT (HiveMQ) ------ */
var mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
    clientId: 'web_' + Math.random().toString(16).substr(2,8),
    keepalive: 60, clean: true
});

mqttClient.on('connect', function() {
    document.getElementById('status').textContent = 'Connected';
    document.getElementById('status').style.color = '#0f0';
    mqttClient.subscribe('esp32p4/status');
});

/* ------ Login state ------ */
var loginAcct = '';
var loginPass = '';
var publishCount = 0;
var allData = {};
var nextP4Id = 0;

/* Pre-loaded test data */
(function() {
    var test = {
        t: Date.now()/1000|0, acct:"test", pass:"123456",
        gps:[118.583128, 24.562736], use_bg:1, zoom:1.0,
        s: [
            {id:0, n:"test1", gps:[118.583128, 24.562736], st:"OK", T:26.5, H:72.0, A:30, UV:0.0},
            {id:1, n:"test2", gps:[118.583622, 24.564094], st:"OK", T:24.0, H:60.0, A:28, UV:2.5},
            {id:2, n:"test3", gps:[118.584610, 24.563189], st:"FLU", T:22.5, H:55.0, A:32, UV:5.0},
            {id:3, n:"test4", gps:[118.582140, 24.564727], st:"VIRT", T:19.8, H:48.0, A:40, UV:7.5},
            {id:4, n:"test5", gps:[118.584906, 24.564365], st:"OK", T:21.0, H:52.0, A:35, UV:9.0},
            {id:5, n:"test6", gps:[118.581646, 24.562736], st:"LOST", T:28.7, H:65.0, A:27, UV:4.0},
            {id:6, n:"test7", gps:[118.583500, 24.565200], st:"OK", T:25.0, H:58.0, A:33, UV:3.0, img:1},
            {id:7, n:"test8", gps:[118.581900, 24.561500], st:"VIRT", T:23.5, H:70.0, A:25, UV:1.5}
        ]
    };
    test._p4id = nextP4Id++;
    allData[test.acct + ':' + test.pass] = [test];
})();

/* ------ Map ------ */
var map = L.map('map').setView([24.5627, 118.5831], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: 'OSM'
}).addTo(map);
var markers = {};
var masterMarkers = {};

mqttClient.on('message', function(topic, message) {
    try {
        var d = JSON.parse(message.toString());
        var key = (d.acct||'') + ':' + (d.pass||'');
        if (d.acct && d.pass) {
            if (!allData[key]) allData[key] = [];
            /* Match by GPS. If same location or no GPS, replace first entry.
               Different GPS (>1km apart) = different P4 unit, keep both. */
            var found = false;
            for (var i = 0; i < allData[key].length; i++) {
                var ex = allData[key][i];
                if (ex.gps && d.gps &&
                    Math.abs(ex.gps[0] - d.gps[0]) < 0.00001 &&
                    Math.abs(ex.gps[1] - d.gps[1]) < 0.00001) {
                    allData[key][i] = d; found = true; break;
                }
            }
            if (!found) {
                if (allData[key].length === 0) {
                    d._p4id = nextP4Id++;
                    allData[key].push(d);
                } else {
                    /* Replace first entry (most common: single P4 per account) */
                    d._p4id = allData[key][0]._p4id;
                    allData[key][0] = d;
                }
            }
        }
        if (!loginAcct) return;
        refreshDisplay();
    } catch(e) {}
});

mqttClient.on('error', function() {
    document.getElementById('status').textContent = 'MQTT error';
    document.getElementById('status').style.color = '#f00';
});
mqttClient.on('close', function() {
    document.getElementById('status').textContent = 'Disconnected';
    document.getElementById('status').style.color = '#f00';
});

/* ------ Login / Logout ------ */
function acctExists(name) {
    for (var k in allData) {
        if (k.split(':')[0] === name) return true;
    }
    return false;
}

function doLogin() {
    var a = document.getElementById('loginAcct').value.trim();
    var p = document.getElementById('loginPass').value.trim();
    var err = document.getElementById('loginErr');
    if (!a || !p) {
        err.textContent = 'Enter account and password'; return;
    }
    if (!acctExists(a)) {
        err.textContent = 'Account error'; return;
    }
    if (!allData[a + ':' + p]) {
        err.textContent = 'Password error'; return;
    }
    loginAcct = a;
    loginPass = p;
    err.textContent = '';
    document.getElementById('login').style.display = 'none';
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('account').textContent = 'Account: ' + a;
    document.getElementById('master').textContent = 'Password: ' + p;
    document.getElementById('zoom').style.display = 'none';
    document.getElementById('bg').style.display = 'none';
    publishCount = 0;
    refreshDisplay();
}

function sendCmd() {
    var cmd = document.getElementById('cmdInput').value.trim();
    if (!cmd) return;
    if (!mqttClient || !mqttClient.connected) {
        alert('MQTT not connected!');
        return;
    }
    mqttClient.publish('esp32p4/cmd', cmd);
    document.getElementById('status').textContent = 'Cmd sent: ' + cmd;
    document.getElementById('cmdInput').value = '';
}

function doLogout() {
    loginAcct = '';
    loginPass = '';
    document.getElementById('login').style.display = 'flex';
    document.getElementById('toolbar').style.display = 'none';
    for (var k in markers) { map.removeLayer(markers[k]); }
    markers = {};
    for (var k in masterMarkers) { map.removeLayer(masterMarkers[k]); }
    masterMarkers = {};
    document.getElementById('slaves').innerHTML = '';
    document.getElementById('counter').textContent = '0000';
    document.getElementById('master').textContent = 'GPS: --';
    document.getElementById('zoom').style.display = '';
    document.getElementById('bg').style.display = '';
}

/* ------ Display refresh ------ */
function refreshDisplay() {
    var key = loginAcct + ':' + loginPass;
    var arr = allData[key];
    if (!arr || arr.length === 0) {
        document.getElementById('time').textContent = 'Waiting for data...'; return;
    }

    publishCount++;
    if (publishCount > 1000) publishCount = 0;
    document.getElementById('counter').textContent =
        String(publishCount).padStart(4, '0');

    var latest = null, totalSlaves = 0;
    var html = '', newKeys = {};
    arr.forEach(function(d) {
        if (!latest || d.t > latest.t) latest = d;
        /* Only show master marker when GPS is actually set */
        if (d.gps && d.gps[0] !== 0 && d.gps[1] !== 0) {
            var mkKey = key + '_' + d._p4id;
            var mk = masterMarkers[mkKey];
            if (!mk) {
                mk = L.marker([d.gps[1], d.gps[0]], {
                    icon: L.divIcon({className:'dot-marker',
                        html:'<div style="width:18px;height:18px;background:#e94560;border-radius:50%;border:3px solid #fff"></div>',
                        iconSize:[18,18], iconAnchor:[9,9]})
                }).addTo(map).bindTooltip('[M] ' + (d.acct||''),
                    {permanent:true,direction:'right',offset:[5,0]});
                masterMarkers[mkKey] = mk;
            } else {
                mk.setLatLng([d.gps[1], d.gps[0]]);
            }
        }

        d.s.forEach(function(s) {
            totalSlaves++;
            var st = s.st;
            var gkey = d._p4id + '_' + (s.id||s.i);
            newKeys[gkey] = true;
            var extra = '';
            if (s.T  !== undefined) extra += 'T='  + s.T.toFixed(1)  + 'C ';
            if (s.H  !== undefined) extra += 'H='  + s.H.toFixed(1)  + '% ';
            if (s.A  !== undefined) extra += 'Alt='+ s.A.toFixed(1)  + 'm ';
            if (s.UV !== undefined) extra += 'UV=' + s.UV.toFixed(1) + ' ';
            if (s.img) extra += '[IMG] ';
            html += '<div class="slave ' + st + '">' +
                '<span class="name">' + s.n + '</span> [' + st + ']<br>' +
                '<span class="val">' + s.gps[1].toFixed(6) + ', ' + s.gps[0].toFixed(6) + '</span><br>' +
                (extra ? '<span class="val">' + extra + '</span>' : '') +
                '<span style="color:#666;font-size:10px"> P4:' + d._p4id + '</span>' +
                '</div>';

            var color = st == 'LOST' ? '#cc0000' : st == 'FLU' ? '#ffcc00' :
                        st == 'VIRT' ? '#0080FF' : '#00cc00';
            if (markers[gkey]) {
                markers[gkey].setLatLng([s.gps[1], s.gps[0]]);
                markers[gkey].setIcon(L.divIcon({className:'dot-marker',
                    html:'<div style="width:14px;height:14px;background:'+color+';border-radius:50%"></div>',
                    iconSize:[14,14], iconAnchor:[7,7]}));
            } else {
                markers[gkey] = L.marker([s.gps[1], s.gps[0]], {
                    icon: L.divIcon({className:'dot-marker',
                        html:'<div style="width:14px;height:14px;background:'+color+';border-radius:50%"></div>',
                        iconSize:[14,14], iconAnchor:[7,7]})
                }).addTo(map).bindTooltip(s.n, {direction:'top',offset:[0,-8]});
            }
        });
    });

    if (latest) {
        document.getElementById('time').textContent =
            'Last update: ' + new Date(latest.t * 1000).toLocaleTimeString();
        document.getElementById('master').textContent =
            'P4 units: ' + arr.length +
            (latest.gps ? '  GPS: ' + latest.gps[1].toFixed(6) + ', ' + latest.gps[0].toFixed(6) : '');
        document.getElementById('count').textContent = 'Slaves: ' + totalSlaves;
        if (latest.gps) map.setView([latest.gps[1], latest.gps[0]]);
    }
    document.getElementById('slaves').innerHTML = html;
    for (var k in markers) {
        if (!newKeys[k]) { map.removeLayer(markers[k]); delete markers[k]; }
    }

    /* Persist across refreshes */
    try {
        localStorage.setItem('esp32p4_data', JSON.stringify(allData));
    } catch(e) {}
}

/* Restore cached data — keep only the latest entry per account */
try {
    var cached = localStorage.getItem('esp32p4_data');
    if (cached) {
        var obj = JSON.parse(cached);
        for (var k in obj) {
            var arr = obj[k];
            if (arr && arr.length > 0) {
                /* Only restore the most recent entry per account */
                var latest = arr[0];
                for (var i = 1; i < arr.length; i++) {
                    if (arr[i].t > latest.t) latest = arr[i];
                }
                latest._p4id = nextP4Id++;
                allData[k] = [latest];
            }
        }
    }
} catch(e) {}

/* Clear any accumulated stale cache */
(function cleanup() {
    try {
        var raw = localStorage.getItem('esp32p4_data');
        if (raw) {
            var obj = JSON.parse(raw);
            var changed = false;
            for (var k in obj) {
                if (obj[k] && obj[k].length > 1) {
                    var latest = obj[k][0];
                    for (var i = 1; i < obj[k].length; i++) {
                        if (obj[k][i].t > latest.t) latest = obj[k][i];
                    }
                    obj[k] = [latest];
                    changed = true;
                }
            }
            if (changed) localStorage.setItem('esp32p4_data', JSON.stringify(obj));
        }
    } catch(e) {}
})();
</script>
</body>
</html>
